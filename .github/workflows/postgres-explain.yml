name: Run Postgres Explain Plan

on:
  push:
    branches: [ main ]

jobs:
  explain-query:
    runs-on: self-hosted  # Change to match your CentOS 9 runner label if needed

    env:
      PGHOST: ${{ secrets.PG_HOST }}
      PGPORT: ${{ secrets.PG_PORT }}
      PGUSER: ${{ secrets.PG_USER }}
      PGPASSWORD: ${{ secrets.PG_PASSWORD }}
      PGDATABASE: ${{ secrets.PG_DATABASE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run EXPLAIN on Postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) SELECT * FROM customers WHERE customer_id = 6;"

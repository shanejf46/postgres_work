name: Run Postgres Explain Plan

on:
  workflow_dispatch:
    inputs:
      pg_host:
        description: 'PostgreSQL Host Address'
        required: true
        type: string
        default: 'localhost'
      pg_port:
        description: 'PostgreSQL Port'
        required: true
        type: string
        default: '5432'
      pg_user:
        description: 'PostgreSQL Username'
        required: true
        type: string
      pg_password:
        description: 'PostgreSQL Password'
        required: true
        type: string
      pg_database:
        description: 'PostgreSQL Database Name'
        required: true
        type: string
      query_text:
        description: 'SQL Query to EXPLAIN (do not include the EXPLAIN keyword)'
        required: true
        type: string
        default: 'SELECT * FROM customers WHERE customer_id = 6;'

jobs:
  explain-query:
    runs-on: self-hosted
    permissions:
      contents: read # 👈 CRITICAL: Must be explicitly included
      packages: write # (or any other custom permissions you have)

    env:
      PGHOST: ${{ inputs.pg_host }}
      PGPORT: ${{ inputs.pg_port }}
      PGUSER: ${{ inputs.pg_user }}
      PGPASSWORD: ${{ inputs.pg_password }}
      PGDATABASE: ${{ inputs.pg_database }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Verify PostgreSQL client
        run: |
          /usr/pgsql-17/bin/psql --version
          
      - name: Test PostgreSQL connection
        run: |
          /usr/pgsql-17/bin/psql -v ON_ERROR_STOP=1 -d ${{PGDATABASE}} -U ${{PGUSER}} -c "SELECT version();"
          
      - name: Run EXPLAIN on Postgres
        env:
          USER_QUERY: ${{ inputs.query_text }}
        run: |
          /usr/pgsql-17/bin/psql -v ON_ERROR_STOP=1 \
            -d ${{PGDATABASE}} -U ${{PGUSER}} -c "EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) $USER_QUERY"
